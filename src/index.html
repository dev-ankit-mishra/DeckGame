<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <title>Deck Game</title>
</head>
<body>
    <main>
        <header>
            <button id="deck">New Deck</button>
            <p class="remaining"></p>
        </header>
        <section>
            <p class="message"></p>
            <p class="computer-score"></p>
            <div id="card1">

            </div>
            <div id="card2">

            </div>
            <p class="my-score"></p>
        </section>
        <footer>
            <button class="draw">Draw</button>
        </footer>
    </main>
    <script src="script.js"></script>
</body>
</html>
